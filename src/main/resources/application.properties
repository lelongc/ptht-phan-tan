spring.application.name=ebook-store
server.port=8080

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ebook_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ebook_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ebook_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis (optional, used for caching/token blacklist)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.data.redis.repositories.enabled=false

# I18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Force UTF-8 for all responses
spring.web.encoding.enabled=true
spring.web.encoding.charset=UTF-8
spring.web.encoding.force=true

# PayPal (sandbox)
paypal.client-id=${PAYPAL_CLIENT_ID:demo}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:demo}
paypal.mode=${PAYPAL_MODE:sandbox}

# VietQR
vietqr.bank-code=${VIETQR_BANK_CODE:MB}
vietqr.account-number=${VIETQR_ACCOUNT_NUMBER:0000000000}
vietqr.account-name=${VIETQR_ACCOUNT_NAME:Shop%20Ebook}

# Token
app.jwt.secret=${APP_JWT_SECRET:change-me-secret-key}
app.jwt.expiration-hours=24

# PayPal
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=sandbox

# App
app.download.max-uses=5
app.order.expire-minutes=15
app.order.download-expire-hours=24

logging.level.org.springframework=INFO
