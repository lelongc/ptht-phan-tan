<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${ebook.title}">Ebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0" th:text="${ebook.title}">Ebook</h3>
        <div>
            <a href="?lang=vi" class="me-2">VI</a>
            <a href="?lang=en">EN</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-4">
                <img th:src="${ebook.coverUrl}" class="img-fluid rounded-start" alt="cover" onerror="this.src='https://via.placeholder.com/300x400?text=Ebook'">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title" th:text="${ebook.title}">Title</h5>
                    <p class="text-muted mb-1" th:text="${ebook.author}">Author</p>
                    <p class="card-text" th:text="${ebook.description}">Description</p>
                    <p class="fw-bold">Price: <span th:text="${ebook.price}"></span> VND</p>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Payment</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="payVqr" value="VIETQR" checked>
                            <label class="form-check-label" for="payVqr">VietQR</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="payPaypal" value="PAYPAL">
                            <label class="form-check-label" for="payPaypal">PayPal</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" id="btnCheckout">Thanh toán</button>
                        <div id="msg" class="text-danger small"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
(function() {
    const ebookId = /*[[${ebook.id}]]*/ 1;
    const btn = document.getElementById('btnCheckout');
    const msg = document.getElementById('msg');
    btn.addEventListener('click', async () => {
        msg.textContent = '';
        const email = document.getElementById('email').value.trim();
        const method = document.querySelector('input[name="payment"]:checked').value;
        if (!email) {
            msg.textContent = 'Vui long nhap email';
            return;
        }
        btn.disabled = true;
        btn.textContent = 'Dang tao don...';
        try {
            const res = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, paymentMethod: method, ebookId: ebookId })
            });
            if (!res.ok) throw new Error('Create order failed');
            const data = await res.json();
            window.location.href = '/payment/' + data.secretCode;
        } catch (e) {
            msg.textContent = e.message;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Thanh toán';
        }
    });
})();
</script>
</body>
</html>
