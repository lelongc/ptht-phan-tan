<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="data:,">
    <title th:text="${ebook.title}">Ebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0" th:text="${ebook.title}">Ebook</h3>
        <div>
            <a href="?lang=vi" class="me-2">VI</a>
            <a href="?lang=en">EN</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="row g-0">
            <div class="col-md-4">
                <div style="width:100%;height:400px;background:#eee;display:flex;align-items:center;justify-content:center;border-radius:0.375rem 0 0 0.375rem;">
                    <span style="color:#999;">Ebook Cover</span>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title" th:text="${ebook.title}">Title</h5>
                    <p class="text-muted mb-1" th:text="${ebook.author}">Author</p>
                    <p class="card-text" th:text="${ebook.description}">Description</p>
                    <p class="fw-bold">Price: <span th:text="${ebook.price}"></span> VND</p>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" id="btnCheckout" th:text="#{app.checkout_button}">Checkout</button>
                        <div id="msg" class="text-danger small"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
(function() {
    var ebookId = /*[[${ebook.id}]]*/ 1;
    var btn = document.getElementById('btnCheckout');
    var msg = document.getElementById('msg');
    var emailInput = document.getElementById('email');
    
    var msgEmailRequired = /*[[#{app.email_required}]]*/ 'Please enter your email';
    var msgCreating = /*[[#{app.creating_order}]]*/ 'Creating order...';
    var msgError = /*[[#{app.order_error}]]*/ 'Error:';
    
    if (!btn) {
        console.log('Button not found');
        return;
    }
    
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        msg.textContent = '';
        var email = emailInput.value.trim();
        
        if (!email) {
            msg.textContent = msgEmailRequired;
            return;
        }
        
        btn.disabled = true;
        var originalText = btn.textContent;
        btn.textContent = msgCreating;
        
        fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, paymentMethod: 'VIETQR', ebookId: ebookId })
        }).then(function(res) {
            if (!res.ok) {
                throw new Error('Create order failed: ' + res.status);
            }
            return res.json();
        }).then(function(data) {
            window.location.href = '/payment/' + data.secretCode;
        }).catch(function(e) {
            msg.textContent = msgError + ' ' + e.message;
            btn.disabled = false;
            btn.textContent = originalText;
        });
    });
})();
</script>
</body>
</html>
