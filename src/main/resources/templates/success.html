<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="data:,">
    <title>Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px;">
    <div class="card shadow-sm p-4 text-center">
        <h3 class="text-success mb-3" th:text="#{app.success_title}">Payment Successful!</h3>
        <p th:text="#{app.success_message}">We will send the download link to your email.</p>
        <p class="mt-3"><strong th:text="#{app.order_code}">Order Code:</strong> <code th:text="${secretCode}">CODE</code></p>
        <div class="mt-4">
            <a href="/" class="btn btn-primary" th:text="#{app.back_home}">Back to Home</a>
            <button onclick="window.location.reload()" class="btn btn-outline-primary ms-2" th:text="#{app.reload_page}">Reload</button>
        </div>
    </div>
</div>
</body>
</html>
