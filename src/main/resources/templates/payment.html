<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Thanh toán</h3>
        <div>
            <a href="?lang=vi" class="me-2">VI</a>
            <a href="?lang=en">EN</a>
        </div>
    </div>

    <div class="card shadow-sm p-4">
        <p class="mb-1"><strong>Ebook:</strong> <span th:text="${ebook.title}">Ebook</span></p>
        <p class="mb-1"><strong>Giá:</strong> <span th:text="${order.amount}"></span> VND</p>
        <p class="mb-3"><strong>Mã đơn:</strong> <code th:text="${secretCode}">CODE</code></p>

        <div th:if="${qrUrl != null}" class="text-center mb-4">
            <p>Quet QR de thanh toan</p>
            <img th:src="${qrUrl}" alt="VietQR" class="img-fluid" style="max-width:360px;">
        </div>

        <div class="text-center mb-4">
            <h5>Chon phuong thuc thanh toan</h5>
            <ul class="nav nav-tabs justify-content-center mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="vietqr-tab" data-bs-toggle="tab" data-bs-target="#vietqr-panel" type="button">VietQR</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="paypal-tab" data-bs-toggle="tab" data-bs-target="#paypal-panel" type="button">PayPal</button>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="vietqr-panel" role="tabpanel">
                    <img th:src="${qrUrl}" alt="VietQR" class="img-fluid" style="max-width:360px;">
                </div>
                <div class="tab-pane fade" id="paypal-panel" role="tabpanel">
                    <div id="paypal-button-container"></div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <div id="status" class="alert alert-info">Dang cho thanh toan...</div>
            <button class="btn btn-outline-secondary btn-sm" id="btnRefresh">Tai lai trang</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
(function() {
    const secret = /*[[${secretCode}]]*/ '';
    const statusEl = document.getElementById('status');
    const btnRefresh = document.getElementById('btnRefresh');

    async function poll() {
        try {
            const res = await fetch('/api/orders/' + secret + '/status');
            if (!res.ok) throw new Error('Cannot get status');
            const data = await res.json();
            if (data.status === 'PAID') {
                statusEl.className = 'alert alert-success';
                statusEl.textContent = 'Thanh toan thanh cong! Dang chuyen sang trang thanh cong...';
                setTimeout(() => { window.location.href = '/success?secretCode=' + secret; }, 800);
            } else if (data.status === 'FAILED' || data.status === 'EXPIRED') {
                statusEl.className = 'alert alert-danger';
                statusEl.textContent = 'Don hang bi that bai/het han. Vui long tao lai.';
            } else {
                statusEl.className = 'alert alert-info';
                statusEl.textContent = 'Dang cho thanh toan...';
            }
        } catch (e) {
            statusEl.className = 'alert alert-warning';
            statusEl.textContent = 'Loi kiem tra trang thai';
        }
    }

    btnRefresh.addEventListener('click', () => poll());
    poll();
    setInterval(poll, 3000);
})();
</script>
</body>
</html>
