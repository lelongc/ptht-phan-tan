<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="data:,">
    <title>Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 th:text="#{app.payment_title}">Payment</h3>
        <div>
            <a href="?lang=vi" class="me-2">VI</a>
            <a href="?lang=en">EN</a>
        </div>
    </div>

    <div class="card shadow-sm p-4">
        <p class="mb-1"><strong th:text="#{app.ebook_label}">Ebook:</strong> <span th:text="${ebookTitle}">Ebook</span></p>
        <p class="mb-1"><strong th:text="#{app.price_label}">Price:</strong> <span th:text="${order.amount}"></span> <span th:text="#{app.currency}">VND</span></p>
        <p class="mb-3"><strong th:text="#{app.order_code}">Order Code:</strong> <code th:text="${secretCode}">CODE</code></p>

        <div class="text-center mb-4">
            <h5 th:text="#{app.choose_payment}">Choose payment method</h5>
            <ul class="nav nav-tabs justify-content-center mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="vietqr-tab" data-bs-toggle="tab" data-bs-target="#vietqr-panel" type="button">VietQR</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="paypal-tab" data-bs-toggle="tab" data-bs-target="#paypal-panel" type="button">PayPal</button>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="vietqr-panel" role="tabpanel">
                    <p class="mb-2" th:text="#{app.scan_qr}">Scan VietQR code to pay</p>
                    <img th:src="${qrUrl}" alt="VietQR" class="img-fluid" style="max-width:360px;">
                </div>
                <div class="tab-pane fade" id="paypal-panel" role="tabpanel">
                    <div id="paypal-container" style="margin-top: 20px; min-height: 400px; padding-bottom: 48px;"></div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <div id="status" class="alert alert-info" th:text="#{app.waiting_payment}">Waiting for payment...</div>
            <button class="btn btn-outline-secondary btn-sm" id="btnRefresh" th:text="#{app.reload_page}">Reload page</button>
        </div>

        <!-- Hidden data for JS -->
        <div style="display:none;">
            <div id="data-secret" th:text="${secretCode}"></div>
            <div id="data-amount" th:text="${order.amount}"></div>
            <div id="data-clientid" th:text="${@environment.getProperty('paypal.client-id')}"></div>
            <div id="i18n-success" th:text="#{app.payment_success_redirect}"></div>
            <div id="i18n-failed" th:text="#{app.order_failed_expired}"></div>
            <div id="i18n-waiting" th:text="#{app.waiting_payment}"></div>
            <div id="i18n-error" th:text="#{app.check_status_error}"></div>
            <div id="i18n-processing" th:text="#{app.processing}"></div>
        </div>
    </div>
</div>

<!-- PayPal Checkout SDK (loaded dynamically) -->

<script th:inline="javascript">
(function() {
    const secret = document.getElementById('data-secret').textContent.trim();
    const vndAmount = parseFloat(document.getElementById('data-amount').textContent.trim());
    const usdAmount = (vndAmount / 25000).toFixed(2);  // VND to USD conversion
    const clientId = document.getElementById('data-clientid').textContent.trim();
    const statusEl = document.getElementById('status');
    const btnRefresh = document.getElementById('btnRefresh');
    
    // Get i18n messages
    const MSG_SUCCESS = document.getElementById('i18n-success').textContent;
    const MSG_FAILED = document.getElementById('i18n-failed').textContent;
    const MSG_WAITING = document.getElementById('i18n-waiting').textContent;
    const MSG_ERROR = document.getElementById('i18n-error').textContent;
    const MSG_PROCESSING = document.getElementById('i18n-processing').textContent;

    console.log('Secret:', secret, 'VND Amount:', vndAmount, 'USD Amount:', usdAmount);

    async function poll() {
        try {
            const res = await fetch('/api/orders/' + secret + '/status');
            if (!res.ok) throw new Error('Cannot get status');
            const data = await res.json();
            if (data.status === 'PAID') {
                statusEl.className = 'alert alert-success';
                statusEl.textContent = MSG_SUCCESS;
                setTimeout(() => { window.location.href = '/success?secretCode=' + secret; }, 800);
            } else if (data.status === 'FAILED' || data.status === 'EXPIRED') {
                statusEl.className = 'alert alert-danger';
                statusEl.textContent = MSG_FAILED;
            } else {
                statusEl.className = 'alert alert-info';
                statusEl.textContent = MSG_WAITING;
            }
        } catch (e) {
            statusEl.className = 'alert alert-warning';
            statusEl.textContent = MSG_ERROR;
        }
    }

    btnRefresh.addEventListener('click', () => poll());
    poll();
    setInterval(poll, 3000);

    // Load PayPal SDK
    function loadPayPalSDK() {
        const script = document.createElement('script');
        script.src = 'https://www.paypal.com/sdk/js?client-id=' + clientId + '&currency=USD';
        script.async = true;
        script.onload = function() {
            if (window.paypal) {
                paypal.Buttons({
                    createOrder: async function(data, actions) {
                        try {
                            const response = await fetch('/api/orders/' + secret + '/paypal/create-order', {
                                method: 'POST'
                            });
                            const orderData = await response.json();
                            if (orderData.error) throw new Error(orderData.error);
                            return orderData.orderId;
                        } catch (error) {
                            console.error('Failed to create order:', error);
                            statusEl.className = 'alert alert-danger';
                            statusEl.textContent = MSG_ERROR + ' ' + error.message;
                            throw error;
                        }
                    },
                    onApprove: async function(data, actions) {
                        try {
                            statusEl.className = 'alert alert-info';
                            statusEl.textContent = MSG_PROCESSING;
                            
                            const response = await fetch('/api/orders/' + secret + '/paypal/capture?paypalOrderId=' + data.orderID, {
                                method: 'POST'
                            });
                            const result = await response.json();
                            
                            if (result.success) {
                                statusEl.className = 'alert alert-success';
                                statusEl.textContent = MSG_SUCCESS;
                                setTimeout(() => { window.location.href = '/success?secretCode=' + secret; }, 1000);
                            } else {
                                throw new Error(result.error);
                            }
                        } catch (error) {
                            console.error('Failed to capture order:', error);
                            statusEl.className = 'alert alert-danger';
                            statusEl.textContent = MSG_ERROR + ' ' + error.message;
                        }
                    },
                    onError: function(err) {
                        console.error('PayPal error:', err);
                        statusEl.className = 'alert alert-danger';
                        statusEl.textContent = MSG_ERROR;
                    }
                }).render('#paypal-container');
            }
        };
        document.head.appendChild(script);
    }

    loadPayPalSDK();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
