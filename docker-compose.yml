version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ebook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ebook_store
      MYSQL_USER: ebook_user
      MYSQL_PASSWORD: ebook_pass
      MYSQL_INITDB_SKIP_TZINFO: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ebook-network
    command: --character-set-server=utf8 --collation-server=utf8_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: ebook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ebook-network

  app:
    image: shima594/ebook:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebook-app
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ebook-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  ebook-network:
    driver: bridge
